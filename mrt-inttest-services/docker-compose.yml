# this file exists as a convenience mechanism for PULLing images
services:
  merritt-ops:
    container_name: merritt-ops
    image: ${ECR_REGISTRY}/merritt-ops:dev
    build:
      context: merritt-ops
      dockerfile: Dockerfile
  merritt-tomcat:
    container_name: merritt-tomcat
    image: ${ECR_REGISTRY}/merritt-tomcat:dev
    build:
      context: merritt-tomcat
      platforms:
      - linux/amd64
      - linux/arm64
      dockerfile: Dockerfile
  mock-merritt-it:
    container_name: mock-merritt-it
    image: ${ECR_REGISTRY}/mock-merritt-it:dev
    build:
      context: mock-merritt-it
      platforms:
      - linux/amd64
      - linux/arm64
      dockerfile: Dockerfile
  db-container:
    container_name: mrt-it-database
    image: ${ECR_REGISTRY}/mrt-it-database:dev
    build:
      context: mrt-it-database
      platforms:
      - linux/amd64
      - linux/arm64
      dockerfile: Dockerfile
  db-container-audit-replic:
    container_name: mrt-it-database-audit-replic
    image: ${ECR_REGISTRY}/mrt-it-database-audit-replic:dev
    build:
      context: mrt-it-database
      platforms:
      - linux/amd64
      - linux/arm64
      dockerfile: Dockerfile
      args:
        LOAD_SQL: /tmp/audit_replic_data.sql
  mrt-rustfs-it:
    container_name: mrt-rustfs-it
    image: ${ECR_REGISTRY}/mrt-rustfs-it:dev
    build:
      context: mrt-rustfs-it
      platforms:
      - linux/amd64
      - linux/arm64
      dockerfile: Dockerfile
      args:
        ECR_REGISTRY: ${ECR_REGISTRY}
  mrt-rustfs-it-with-content:
    container_name: mrt-rustfs-it-with-content
    image: ${ECR_REGISTRY}/mrt-rustfs-it-with-content:dev
    build:
      context: mrt-rustfs-it-with-content
      platforms:
      - linux/amd64
      - linux/arm64
      dockerfile: Dockerfile
      args:
        ECR_REGISTRY: ${ECR_REGISTRY}
  mysql-ruby-lambda:
    container_name: mysql-ruby-lambda
    image: ${ECR_REGISTRY}/mysql-ruby-lambda
    build:
      context: mysql-ruby-lambda
      platforms:
      - linux/amd64
      - linux/arm64
      dockerfile: Dockerfile
  reveal-md:
    container_name: reveal-md
    image: ${ECR_REGISTRY}/reveal-md
    build:
      context: reveal-md
      dockerfile: Dockerfile
      args:
        ECR_REGISTRY: ${ECR_REGISTRY}
  smtp:
    container_name: smtp
    image: ${ECR_REGISTRY}/mrt-smtp
    build:
      context: mrt-smtp
      platforms:
      - linux/amd64
      - linux/arm64
      dockerfile: Dockerfile
      args:
        SES_PARMS: '${SES_PARAMS}'
        ECR_REGISTRY: ${ECR_REGISTRY}
